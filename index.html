<style>
  :root{
    --bg:#0A0B11; --bg-soft:#0F1119; --surface:#161925; --surface-2:#1E2233;
    --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
    --text:#F3F5FB; --muted:#9AA2BB; --dim:#6B7391;
    --accent:#FF7A93; --accent-2:#FFA26B;
    --accent-a08:rgba(255,122,147,.08);
    --accent-a14:rgba(255,122,147,.14);
    --accent-a28:rgba(255,122,147,.28);
    --ok:#4ADE80; --warn:#FFB020; --danger:#FF6B6B;
    --shadow:0 24px 60px -30px rgba(0,0,0,.9);
    --radius:26px;
    color-scheme:dark;
  }
  [data-theme="light"]{
    --bg:#F4F5FA; --bg-soft:#EBEEF7; --surface:#FFFFFF; --surface-2:#F2F4FB;
    --line:rgba(18,22,45,.08); --line-strong:rgba(18,22,45,.18);
    --text:#12141F; --muted:#5B6377; --dim:#8A90A4;
    --shadow:0 24px 60px -34px rgba(30,38,80,.35);
    color-scheme:light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Noto Sans","Helvetica Neue","Segoe UI",Roboto,"Malgun Gothic",Arial,system-ui,sans-serif;
    background:var(--bg); color:var(--text); min-height:100dvh;
    overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:-25%; z-index:0; pointer-events:none;
    background:
      radial-gradient(42% 34% at 12% 6%, var(--accent-a14), transparent 70%),
      radial-gradient(38% 32% at 94% 18%, rgba(112,146,255,.13), transparent 72%),
      radial-gradient(46% 38% at 62% 104%, var(--accent-a08), transparent 72%);
    filter:blur(14px);
  }
  [data-theme="light"] body::before{opacity:.55}
  button{font-family:inherit; color:inherit; border:0; background:none; cursor:pointer;
    -webkit-user-select:none; user-select:none; touch-action:manipulation}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  [hidden]{display:none !important}

  .app{
    position:relative; z-index:1; width:100%; max-width:480px; margin:0 auto;
    height:100vh; height:100dvh; max-height:100dvh; overflow:hidden;
    display:flex; flex-direction:column;
  }
  @media (min-width:560px){
    body{background:
      radial-gradient(60% 50% at 50% -10%, #14161f, #05060a 70%);
    }
    [data-theme="light"] body{background:
      radial-gradient(60% 50% at 50% -10%, #ffffff, #dfe3f0 75%);
    }
    .app{box-shadow:0 0 0 1px var(--line), 0 40px 120px -40px rgba(0,0,0,.8)}

  .empty{

  .rep{
    flex:none; height:34px; padding:0 11px; border-radius:10px; font-size:12px; font-weight:650;

  .speeds{gap:4px; margin-bottom:8px}

  var LS_KEY = "shadowing-lab-v1";

  // SVG 요소는 hidden 속성이 동작하지 않아 속성으로 직접 제어
  function setHidden(el, hide){
    if (!el) return;
    if (hide) el.setAttribute("hidden", "");
    else el.removeAttribute("hidden");
  }

  function todayStr(){
    var d = new Date();
    var m = ("0" + (d.getMonth() + 1)).slice(-2);
    var day = ("0" + d.getDate()).slice(-2);
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function defaultState(){
    var light = false;
    try { light = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches; } catch(e){}
    return {
      lang: "ru",
      cat: "movie",
      pos: {},
      theme: light ? "light" : "dark",
      speed: 0.9,
      repeat: 1,
      show: { text: true, pron: true, ko: true },
      done: {},
      today: { date: todayStr(), keys: [] },
      custom: { ru: [], en: [] }
    };
  }

  function loadState(){
    var base = defaultState();
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return base;
      var s = JSON.parse(raw);
      if (!s || typeof s !== "object") return base;
      base.lang = (s.lang === "en") ? "en" : "ru";
      base.cat = typeof s.cat === "string" ? s.cat : "movie";
      // 예전에 저장된 카테고리가 지금 없는 id이면 첫 카테고리로 되돌린다
      // (새 카테고리는 저장값과 무관하게 항상 목록에 나타난다)
      var catList = (CONTENT[base.lang] && CONTENT[base.lang].cats) || [];
      var catOk = base.cat === "custom" || catList.some(function(c){ return c.id === base.cat; });
      if (!catOk) base.cat = catList.length ? catList[0].id : "movie";
      base.pos = (s.pos && typeof s.pos === "object") ? s.pos : {};
      base.theme = (s.theme === "light") ? "light" : "dark";
      base.speed = [0.6, 0.75, 0.9, 1, 1.15].indexOf(Number(s.speed)) >= 0 ? Number(s.speed) : 0.9;
      base.repeat = (s.repeat === 3 || s.repeat === 0) ? s.repeat : 1;
      if (s.show && typeof s.show === "object"){
        base.show = {
          text: s.show.text !== false,
          pron: s.show.pron !== false,
          ko: s.show.ko !== false
        };
      }
      base.done = (s.done && typeof s.done === "object") ? s.done : {};
      if (s.today && s.today.date === todayStr() && Array.isArray(s.today.keys)){
        base.today = { date: s.today.date, keys: s.today.keys };
      }
      if (s.custom && typeof s.custom === "object"){
        ["ru","en"].forEach(function(l){
          if (Array.isArray(s.custom[l])){
            base.custom[l] = s.custom[l].filter(function(it){
              return it && typeof it.text === "string" && it.text.trim();
            }).map(function(it){
              return {
                id: String(it.id || ("c" + Math.random().toString(36).slice(2,8))),
                text: String(it.text).slice(0, 300),
                pron: String(it.pron || "").slice(0, 200),
                ko: String(it.ko || "").slice(0, 200),
                note: String(it.note || "").slice(0, 200),
                tag: "내 문장"
              };
            });
          }
        });
      }
      return base;
    } catch(e){
      return base;
    }
  }

  var state = loadState();
  var saveTimer = null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
    }, 60);
  }

  function ensureToday(){
    var t = todayStr();
    if (!state.today || state.today.date !== t){
      state.today = { date: t, keys: [] };
    }
  }

  /* ════════════════════════════════════════════
     공용 헬퍼
     ════════════════════════════════════════════ */
  function cfg(){ return CONTENT[state.lang]; }
  function posKey(lang, cat){ return (lang || state.lang) + ":" + (cat || state.cat); }

  function itemsFor(lang, cat){
    if (cat === "custom") return state.custom[lang] || [];
    var pack = (CONTENT[lang].cats || []).filter(function(c){ return c.id === cat; })[0];
    return pack ? pack.items : [];
  }
  function currentItems(){ return itemsFor(state.lang, state.cat); }
  function currentIndex(){
    var arr = currentItems();
    var i = Number(state.pos[posKey()] || 0);
    if (!isFinite(i) || i < 0) i = 0;
    if (i > arr.length - 1) i = Math.max(0, arr.length - 1);
    return i;
  }
  function currentItem(){ return currentItems()[currentIndex()] || null; }
  function itemKey(item){ return state.lang + ":" + state.cat + ":" + item.id; }
  function isDone(item){ return !!state.done[itemKey(item)]; }
  function doneCount(list){
    var n = 0;
    for (var i = 0; i < list.length; i++) if (isDone(list[i])) n++;
    return n;
  }

  var toastTimer = null;
  function toast(msg, ms){
    var el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, ms || 2800);
  }

  function hexToRgb(hex){
    var h = hex.replace("#","");
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function alpha(hex, a){
    var c = hexToRgb(hex);
    return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
  }

  var voices = [];

  var playing = false;
  var repLeft = 0;
  var repTimer = null;

  function refreshVoices(){
    if (!ttsSupported){ voices = []; updateVoiceNote(); return; }
    try { voices = window.speechSynthesis.getVoices() || []; } catch(e){ voices = []; }
    updateVoiceNote();
  }
  function voicesReady(){
    return voices.length > 0;
  }
  function hasVoiceFor(lang){
    var pre = lang === "ru" ? "ru" : "en";
    return voices.some(function(v){
      var l = String(v.lang || "").toLowerCase().replace("_","-");
      return l.indexOf(pre) === 0;
    });
  }
  function pickVoice(){
    if (!voices.length) return null;
    var pre = state.lang === "ru" ? "ru" : "en";
    var cands = voices.filter(function(v){
      return String(v.lang || "").toLowerCase().replace("_","-").indexOf(pre) === 0;
    });
    if (!cands.length) return null;
    var want = state.lang === "ru" ? "ru-ru" : "en-us";
    var exact = cands.filter(function(v){
      return String(v.lang || "").toLowerCase().replace("_","-").indexOf(want) === 0;
    });
    var pool = exact.length ? exact : cands;
    var nice = pool.filter(function(v){
      return /natural|premium|enhanced|google|siri|samantha|milena|yuri/i.test(v.name || "");
    });
    return (nice[0] || pool[0]);
  }
  function updateVoiceNote(){
    var el = $("#voiceNote");
    if (!el) return;
    var show = false, msg = "";
    if (!ttsSupported && !voicesReady()){
      show = true;
      msg = "이 브라우저는 음성 재생을 지원하지 않아요. 아이폰 Safari에서 열어 주세요.";
    } else if (voicesReady() && !hasVoiceFor(state.lang)){
      show = true;
      msg = cfg().voiceTip;
    }
    el.hidden = !show;
    if (show) el.textContent = msg;
  }

  function updatePlayUI(){
    var btn = $("#playBtn");

    setHidden($("#playIcon"), playing);
    setHidden($("#pauseIcon"), !playing);
    $("#card").classList.toggle("playing", playing);
  }

  function stopSpeech(){
    speechSession += 1;

    repLeft = 0;
    clearTimeout(repTimer);

    updatePlayUI();

  function speakOnce(text, sess){
    if (!playing || !ttsSupported || sess !== speechSession) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = cfg().speechLang;
    var v = pickVoice();
    if (v) u.voice = v;
    u.rate = state.speed;

    u.volume = 1;

    var started = false;
    var guard = setTimeout(function(){
      if (sess === speechSession && playing && !started){
        playing = false;
        updatePlayUI();
        toast("음성을 재생하지 못했어요. 기기 음성 설정을 확인해 주세요.", 3400);
      }

    u.onstart = function(){ started = true; clearTimeout(guard); };
    u.onend = function(){
      clearTimeout(guard);
      if (sess !== speechSession || !playing) return;
      if (repLeft === Infinity){
        repTimer = setTimeout(function(){ speakOnce(text, sess); }, 480);
        return;
      }
      repLeft -= 1;
      if (repLeft > 0){
        repTimer = setTimeout(function(){ speakOnce(text, sess); }, 480);
      } else {
        playing = false;
        updatePlayUI();
      }
    };

      clearTimeout(guard);
      if (sess !== speechSession) return;
      var err = ev && ev.error;
      if (err === "interrupted" || err === "canceled") return;

      if (err !== "not-allowed") toast("음성을 재생할 수 없어요. 잠시 후 다시 시도해 주세요.");
    };
    try { window.speechSynthesis.speak(u); }
    catch(err){
      clearTimeout(guard);
      playing = false;
      updatePlayUI();
      toast("음성을 재생할 수 없어요.");
    }
  }

  function markPracticed(){
    ensureToday();
    var item = currentItem();
    if (!item) return;
    var k = itemKey(item);
    if (state.today.keys.indexOf(k) < 0){
      state.today.keys.push(k);
      save();
      renderStats();
    }
  }

  function play(){
    if (playing){ stopSpeech(); return; }
    var item = currentItem();
    if (!item) return;
    if (!ttsSupported){
      toast("이 브라우저는 음성 재생을 지원하지 않아요.", 3200);
      return;
    }
    if (!voicesReady()){
      // 음성 목록이 아직 로드되지 않았을 수 있음 — 한 번 더 시도
      refreshVoices();
    }
    stopSpeech();
    speechSession += 1;
    playing = true;
    repLeft = state.repeat === 0 ? Infinity : state.repeat;
    updatePlayUI();
    markPracticed();
    speakOnce(item.text, speechSession);
  }

  /* ════════════════════════════════════════════
     렌더 — 언어 / 카테고리 / 카드 / 통계
     ════════════════════════════════════════════ */
  function renderLangs(){
    $$(".lang").forEach(function(b){
      var on = b.getAttribute("data-lang") === state.lang;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
  }

  function renderCats(){
    var wrap = $("#cats");
    wrap.innerHTML = "";
    var cats = CONTENT[state.lang].cats.concat([{ id:"custom", icon:"✏️", name:"내 문장", items: state.custom[state.lang] }]);
    cats.forEach(function(c){
      var b = document.createElement("button");
      b.className = "chip" + (state.cat === c.id ? " active" : "");
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", state.cat === c.id ? "true" : "false");
      b.setAttribute("data-cat", c.id);

      var ic = document.createElement("span");
      ic.className = "ci";
      ic.textContent = c.icon;
      var nm = document.createElement("span");
      nm.textContent = c.name;
      b.appendChild(ic);
      b.appendChild(nm);

      if (c.id === "custom"){
        var cnt = document.createElement("span");
        cnt.className = "cnt";
        cnt.textContent = String(c.items.length);
        b.appendChild(cnt);
      }
      b.addEventListener("click", function(){ switchCat(c.id); });
      wrap.appendChild(b);
    });
    var active = wrap.querySelector(".chip.active");
    if (active && active.scrollIntoView){
      try { active.scrollIntoView({ block:"nearest", inline:"nearest" }); } catch(e){}
    }
  }

  function renderStats(){
    ensureToday();
    $("#todayNum").textContent = String(state.today.keys.length);
  }

  function renderCard(animate){
    var items = currentItems();
    var empty = (state.cat === "custom" && items.length === 0);

    $("#card").hidden = empty;
    $("#emptyState").hidden = !empty;
    if (empty){
      renderSuggestions();
      updateDock();
      return;
    }

    var i = currentIndex();
    state.pos[posKey()] = i;
    var item = items[i];
    if (!item) { updateDock(); return; }

    $("#tag").textContent = item.tag || (state.cat === "custom" ? "내 문장" : "연습 문장");
    $("#tag").title = item.tag || "";

    var orig = $("#origText");
    orig.textContent = item.text;
    var len = item.text.length;
    orig.classList.toggle("long", len > 76 && len <= 128);
    orig.classList.toggle("xlong", len > 128);

    var pron = $("#pronText");
    pron.textContent = item.pron || "";
    if (item.pron && item.lat){
      var lat = document.createElement("span");
      lat.className = "lat";
      lat.textContent = item.lat;
      pron.appendChild(lat);
    }
    pron.hidden = !(state.show.pron && item.pron);

    var ko = $("#koText");
    ko.textContent = item.ko || "";
    ko.hidden = !(state.show.ko && item.ko);

    var note = $("#noteText");
    note.textContent = item.note ? ("메모 · " + item.note) : "";
    note.hidden = !item.note;

    orig.hidden = !state.show.text;
    var allOff = !state.show.text && !state.show.pron && !state.show.ko;
    $("#listenHint").hidden = !allOff;

    $("#posText").textContent = (i + 1) + " / " + items.length;
    $("#posBar").style.width = Math.round(((i + 1) / items.length) * 100) + "%";

    var done = isDone(item);
    var cb = $("#checkBtn");
    cb.classList.toggle("on", done);
    cb.setAttribute("aria-pressed", done ? "true" : "false");
    $("#checkLabel").textContent = done ? "완료" : "익혔어요";

    $("#langLabel").textContent = cfg().name;
    $("#doneText").textContent = doneCount(items) + " / " + items.length + " 익힘";

    var isCustom = state.cat === "custom";
    $("#addBtn").hidden = !isCustom;
    $("#editBtn").hidden = !isCustom;
    $("#delBtn").hidden = !isCustom;
    $("#addBtn").setAttribute("aria-label", "새 문장 추가");
    $("#editBtn").setAttribute("aria-label", "이 문장 수정");
    $("#delBtn").setAttribute("aria-label", "이 문장 삭제");

    $("#card").classList.remove("enter");
    if (animate){
      void $("#card").offsetWidth;
      $("#card").classList.add("enter");
    }
    updateDock();
  }

  function renderSuggestions(){
    var box = $("#sugg");
    box.innerHTML = "";
    (cfg().suggestions || []).forEach(function(s){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = s.text;
      b.addEventListener("click", function(){
        openEditSheet(null, s);
      });
      box.appendChild(b);
    });
  }

  function updateToggles(){
    $$(".tg").forEach(function(b){
      var k = b.getAttribute("data-show");
      b.setAttribute("aria-pressed", state.show[k] ? "true" : "false");
    });
  }

  function updateDock(){
    updateToggles();
    $$("#speeds button").forEach(function(b){
      b.classList.toggle("active", Number(b.getAttribute("data-speed")) === Number(state.speed));
    });
    var repTxt = state.repeat === 0 ? "∞" : (state.repeat + "회");
    $("#repBtn").textContent = "⟳ " + repTxt;
    $("#repBtn").setAttribute("aria-label", "반복 " + repTxt + ", 눌러서 변경");

    var items = currentItems();
    var none = items.length === 0;
    var one = items.length < 2;
    $("#prevBtn").disabled = none || one;
    $("#nextBtn").disabled = none || one;
    $("#playBtn").disabled = none;
    $("#micBtn").disabled = none;
  }

  function render(animate){
    applyTheme();
    applyAccent();
    renderLangs();
    renderCats();
    renderCard(animate);
    renderStats();
    updateVoiceNote();
  }

  /* ════════════════════════════════════════════
     내비게이션
     ════════════════════════════════════════════ */
  function go(delta){
    var arr = currentItems();
    if (!arr.length) return;
    stopSpeech();
    var i = currentIndex() + delta;
    if (i < 0) i = arr.length - 1;
    if (i > arr.length - 1) i = 0;
    state.pos[posKey()] = i;
    save();
    renderCard(true);
  }

  function catExists(lang, cat){
    if (cat === "custom") return true;
    return ((CONTENT[lang] && CONTENT[lang].cats) || []).some(function(c){ return c.id === cat; });
  }

  function switchLang(lang){
    if (lang === state.lang) return;
    stopSpeech();
    state.lang = lang;
    // 언어마다 카테고리 구성이 다르다 (예: "토르플 1~9일차"는 러시아어 전용)
    // 지금 카테고리가 이 언어에 없으면 첫 카테고리로 옮겨 간다
    if (!catExists(lang, state.cat)){
      var list = (CONTENT[lang] && CONTENT[lang].cats) || [];
      state.cat = list.length ? list[0].id : "custom";
    }
    save();
    render(true);
  }

  function switchCat(cat){
    if (cat === state.cat) return;
    stopSpeech();
    state.cat = cat;
    save();
    render(true);
  }

  /* ════════════════════════════════════════════
     완료 체크
     ════════════════════════════════════════════ */
  function toggleDone(){
    var item = currentItem();
    if (!item) return;
    var k = itemKey(item);
    if (state.done[k]){
      delete state.done[k];
    } else {
      state.done[k] = true;
      ensureToday();
      if (state.today.keys.indexOf(k) < 0) state.today.keys.push(k);
      toast("한 문장 익혔어요.");
    }
    save();
    renderCard(false);
    renderStats();
  }

  /* ════════════════════════════════════════════
     내 문장 추가 / 수정 / 삭제
     ════════════════════════════════════════════ */
  var editingId = null;
  var deleteArmed = false;
  var deleteTimer = null;

  function openSheet(which){
    $("#overlay").hidden = false;
    $("#recSheet").hidden = which !== "rec";
    $("#editSheet").hidden = which !== "edit";
    document.body.style.overflow = "hidden";
  }
  function closeSheet(){
    if (recState === "recording") discarding = true;
    stopRecording(true);
    resetRec();
    $("#overlay").hidden = true;
    $("#recSheet").hidden = true;
    $("#editSheet").hidden = true;
    document.body.style.overflow = "";
  }

  function openEditSheet(id, seed){
    stopSpeech();
    editingId = id || null;
    var item = null;
    if (id){
      var arr = state.custom[state.lang];
      for (var i = 0; i < arr.length; i++) if (arr[i].id === id) item = arr[i];
    }
    $("#editTitle").textContent = id ? "내 문장 수정" : "내 문장 추가";
    $("#fieldLang").textContent = cfg().name;
    $("#fText").value = item ? item.text : (seed ? seed.text : "");
    $("#fPron").value = item ? (item.pron || "") : (seed ? (seed.pron || "") : "");
    $("#fKo").value = item ? (item.ko || "") : (seed ? (seed.ko || "") : "");
    $("#fNote").value = item ? (item.note || "") : "";
    $("#fText").placeholder = state.lang === "ru" ? "예: Ты самая красивая." : "예: You look great today.";
    openSheet("edit");
    setTimeout(function(){ try { $("#fText").focus(); } catch(e){} }, 260);
  }

  function saveCustom(){
    var text = ($("#fText").value || "").trim();
    if (!text){ toast("원어 문장을 입력해 주세요."); return; }
    if (text.length > 300) text = text.slice(0, 300);
    var obj = {
      text: text,
      pron: ($("#fPron").value || "").trim().slice(0, 200),
      ko: ($("#fKo").value || "").trim().slice(0, 200),
      note: ($("#fNote").value || "").trim().slice(0, 200)
    };
    var arr = state.custom[state.lang];
    if (editingId){
      for (var i = 0; i < arr.length; i++){
        if (arr[i].id === editingId){
          arr[i].text = obj.text; arr[i].pron = obj.pron; arr[i].ko = obj.ko; arr[i].note = obj.note;
          break;
        }
      }
    } else {
      obj.id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      obj.tag = "내 문장";
      arr.push(obj);
      state.pos[posKey(state.lang, "custom")] = arr.length - 1;
    }
    save();
    var wasEdit = !!editingId;
    editingId = null;
    closeSheet();
    state.cat = "custom";
    render(true);
    toast(wasEdit ? "문장을 수정했어요." : "내 문장에 추가했어요.");
  }

  function deleteCurrent(){
    if (state.cat !== "custom") return;
    var item = currentItem();
    if (!item) return;
    if (!deleteArmed){
      deleteArmed = true;
      $("#delBtn").classList.add("danger");
      toast("한 번 더 누르면 이 문장이 삭제돼요.", 2600);
      clearTimeout(deleteTimer);
      deleteTimer = setTimeout(function(){
        deleteArmed = false;
        $("#delBtn").classList.remove("danger");
      }, 3000);
      return;
    }
    clearTimeout(deleteTimer);
    deleteArmed = false;
    $("#delBtn").classList.remove("danger");
    var arr = state.custom[state.lang];
    for (var i = 0; i < arr.length; i++){
      if (arr[i].id === item.id){ arr.splice(i, 1); break; }
    }
    delete state.done[itemKey(item)];
    var k = posKey(state.lang, "custom");
    state.pos[k] = Math.max(0, Math.min(currentIndex(), arr.length - 1));
    save();
    render(true);
    toast("문장을 삭제했어요.");
  }

  /* ════════════════════════════════════════════
     녹음 (MediaRecorder)
     ════════════════════════════════════════════ */
  var recState = "idle"; // idle | recording | ready
  var discarding = false;
  var mediaRecorder = null;
  var recChunks = [];
  var recStream = null;
  var recUrl = null;
  var recTimer = null;
  var recSecs = 0;
  var recMime = "";

  function fmtTime(s){
    var m = Math.floor(s / 60), r = s % 60;
    return ("0" + m).slice(-2) + ":" + ("0" + r).slice(-2);
  }

  function buildWave(){
    var w = $("#wave");
    if (w.childNodes.length) return;
    for (var i = 0; i < 22; i++){
      var bar = document.createElement("i");
      var h = 18 + Math.round(Math.abs(Math.sin(i * 1.7)) * 64);
      bar.style.height = h + "%";
      bar.style.animationDelay = (i * 0.045).toFixed(2) + "s";
      w.appendChild(bar);
    }
  }

  function setRecUI(){
    var sheet = $("#recSheet");
    var box = $("#recBox");
    var btn = $("#recToggle");
    sheet.classList.toggle("recording", recState === "recording");
    box.classList.toggle("recording", recState === "recording");
    $("#micBtn").classList.toggle("rec", recState === "recording" && !$("#overlay").hidden);

    if (recState === "recording"){
      btn.textContent = "녹음 중지";
      $("#recTime").classList.remove("idle");
      $("#recNote").textContent = "또박또박, 원어민의 억양을 따라 해 보세요.";
    } else if (recState === "ready"){
      btn.textContent = "다시 녹음";
      $("#recNote").textContent = "잘했어요! 내 녹음과 원어민 발음을 번갈아 들으며 비교해 보세요.";
    } else {
      btn.textContent = "녹음 시작";
      $("#recTime").classList.add("idle");
      $("#recTime").textContent = "녹음 대기";
      $("#recNote").textContent = "아이폰은 처음 한 번 마이크 권한을 물어봐요. 허용해 주세요.";
    }
    $("#recPlay").disabled = !recUrl;
  }

  function openRecSheet(){
    var item = currentItem();
    if (!item) return;
    stopSpeech();
    discarding = false;
    resetRec();
    $("#recSentence").textContent = item.text;
    buildWave();
    openSheet("rec");
    setRecUI();
  }

  function resetRec(){
    clearInterval(recTimer);
    if (recUrl){ try { URL.revokeObjectURL(recUrl); } catch(e){} recUrl = null; }
    recChunks = [];
    recState = "idle";
    recSecs = 0;
    var t = $("#recTime");
    if (t){ t.textContent = "녹음 대기"; t.classList.add("idle"); }
    setRecUI();
  }

  function startRecording(){
    if (recState === "recording") return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
      recFail("이 브라우저에서는 녹음을 지원하지 않아요. 아이폰 Safari에서 열어 주세요.");
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
      recStream = stream;
      recChunks = [];
      var opts = {};
      try {
        if (window.MediaRecorder.isTypeSupported){
          if (MediaRecorder.isTypeSupported("audio/mp4")) opts = { mimeType: "audio/mp4" };
          else if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) opts = { mimeType: "audio/webm;codecs=opus" };
          else if (MediaRecorder.isTypeSupported("audio/webm")) opts = { mimeType: "audio/webm" };
        }
      } catch(e){ opts = {}; }

      try { mediaRecorder = new MediaRecorder(stream, opts); }
      catch(e){ try { mediaRecorder = new MediaRecorder(stream); } catch(e2){ recFail("녹음기를 시작할 수 없어요."); return; } }

      recMime = mediaRecorder.mimeType || "";
      mediaRecorder.ondataavailable = function(ev){
        if (ev.data && ev.data.size > 0) recChunks.push(ev.data);
      };
      mediaRecorder.onstop = function(){
        clearInterval(recTimer);
        cleanupStream();
        if (discarding){
          discarding = false;
          recState = "idle";
          setRecUI();
          return;
        }
        try {
          var blob = new Blob(recChunks, { type: recMime || "audio/mp4" });
          if (recUrl) { try { URL.revokeObjectURL(recUrl); } catch(e){} }
          recUrl = URL.createObjectURL(blob);
          recState = "ready";
        } catch(e){
          recState = "idle";
        }
        setRecUI();
      };
      mediaRecorder.start();
      recState = "recording";
      recSecs = 0;
      $("#recTime").textContent = "00:00";
      clearInterval(recTimer);
      recTimer = setInterval(function(){
        recSecs++;
        $("#recTime").textContent = fmtTime(recSecs);
        if (recSecs >= 60) stopRecording();
      }, 1000);
      setRecUI();
    }).catch(function(err){
      var name = (err && err.name) || "";
      if (name === "NotAllowedError" || name === "SecurityError" || name === "PermissionDeniedError"){
        recFail("마이크 권한이 꺼져 있어요. 아이폰 설정 › Safari › 마이크에서 허용해 주세요.");
      } else if (name === "NotFoundError" || name === "DevicesNotFoundError"){
        recFail("마이크를 찾지 못했어요. 이어폰 마이크나 기기 마이크를 확인해 주세요.");
      } else {
        recFail("녹음을 시작할 수 없어요. 다른 앱이 마이크를 쓰고 있지 않은지 확인해 주세요. (" + (name || "error") + ")");
      }
    });
  }

  function recFail(msg){
    recState = "idle";
    toast(msg, 4200);
    setRecUI();
    $("#recNote").textContent = msg;
  }

  function stopRecording(silent){
    clearInterval(recTimer);
    if (mediaRecorder && mediaRecorder.state === "recording"){
      try { mediaRecorder.stop(); } catch(e){}
    }
    if (silent && recState === "recording"){
      recState = "idle";
      cleanupStream();
      setRecUI();
    }
  }

  function cleanupStream(){
    if (recStream){
      try { recStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
      recStream = null;
    }
  }

  function toggleRecord(){
    if (recState === "recording") stopRecording();
    else startRecording();
  }

  function playRecording(){
    if (!recUrl) return;
    try {
      var a = new Audio(recUrl);
      a.play().catch(function(){ toast("녹음을 재생할 수 없어요."); });
    } catch(e){ toast("녹음을 재생할 수 없어요."); }
  }

  function playModelInSheet(){
    var item = currentItem();
    if (!item) return;
    // 시트에서 원어민 발음 다시 듣기
    stopSpeech();
    if (!ttsSupported) { toast("이 브라우저는 음성 재생을 지원하지 않아요."); return; }
    var u = new SpeechSynthesisUtterance(item.text);
    u.lang = cfg().speechLang;
    var v = pickVoice();
    if (v) u.voice = v;
    u.rate = state.speed;
    try { window.speechSynthesis.speak(u); } catch(e){ toast("음성을 재생할 수 없어요."); }
  }

  /* ════════════════════════════════════════════
     이벤트 연결
     ════════════════════════════════════════════ */
  function bind(){
    $$(".lang").forEach(function(b){
      b.addEventListener("click", function(){ switchLang(b.getAttribute("data-lang")); });
    });

    $("#themeBtn").addEventListener("click", function(){
      state.theme = state.theme === "dark" ? "light" : "dark";
      save();
      applyTheme();
      applyAccent();
    });

    $("#playBtn").addEventListener("click", play);
    $("#prevBtn").addEventListener("click", function(){ go(-1); });
    $("#nextBtn").addEventListener("click", function(){ go(1); });
    $("#micBtn").addEventListener("click", openRecSheet);
    $("#checkBtn").addEventListener("click", toggleDone);

    $("#repBtn").addEventListener("click", function(){
      state.repeat = state.repeat === 1 ? 3 : (state.repeat === 3 ? 0 : 1);
      save();
      updateDock();
      if (playing){
        stopSpeech();
        play();
      }
    });

    $$("#speeds button").forEach(function(b){
      b.addEventListener("click", function(){
        state.speed = Number(b.getAttribute("data-speed"));
        save();
        updateDock();
        if (playing){
          stopSpeech();
          play();
        }
      });
    });

    $$(".tg").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.getAttribute("data-show");
        state.show[k] = !state.show[k];
        if (!state.show.text && !state.show.pron && !state.show.ko){
          toast("자막을 모두 가리면 들리는 소리만으로 연습해요.");
        }
        save();
        updateToggles();
        renderCard(false);
      });
    });

    $("#emptyAddBtn").addEventListener("click", function(){ openEditSheet(null); });
    $("#addBtn").addEventListener("click", function(){ openEditSheet(null); });
    $("#editBtn").addEventListener("click", function(){
      var item = currentItem();
      if (item) openEditSheet(item.id);
    });
    $("#delBtn").addEventListener("click", deleteCurrent);
    $("#saveBtn").addEventListener("click", saveCustom);

    $("#recToggle").addEventListener("click", toggleRecord);
    $("#recPlay").addEventListener("click", playRecording);
    $("#recModel").addEventListener("click", playModelInSheet);

    $$("[data-close]").forEach(function(b){ b.addEventListener("click", closeSheet); });
    $("#overlay").addEventListener("click", function(e){
      if (e.target === $("#overlay")) closeSheet();
    });

    $("#fText").addEventListener("keydown", function(e){
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) saveCustom();
    });

    document.addEventListener("keydown", function(e){
      if (e.key === "Escape" && !$("#overlay").hidden){ closeSheet(); return; }
      var tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
      if (!$("#overlay").hidden) return;
      if (e.code === "Space"){ e.preventDefault(); play(); }
      else if (e.code === "ArrowLeft"){ go(-1); }
      else if (e.code === "ArrowRight"){ go(1); }
    });

    document.addEventListener("visibilitychange", function(){
      if (document.hidden){
        stopSpeech();
        if (recState === "recording") stopRecording();
      }
    });

    window.addEventListener("pagehide", function(){
      stopSpeech();
      cleanupStream();
    });

    if (ttsSupported){
      refreshVoices();
      if (typeof window.speechSynthesis.addEventListener === "function"){
        window.speechSynthesis.addEventListener("voiceschanged", refreshVoices);
      } else {
        window.speechSynthesis.onvoiceschanged = refreshVoices;
      }
      setTimeout(refreshVoices, 600);
      setTimeout(refreshVoices, 1800);
    }
  }

  /* ════════════════════════════════════════════
     시작
     ════════════════════════════════════════════ */
  bind();
  render(false);
  window.__appReady = true;

  // 검증용 최소 핸들 (읽기 전용 성격)
  window.__shadowing = {
    get state(){ return state; },
    items: function(){ return currentItems(); },
    item: currentItem,
    render: render,
    version: 1
  };
})();
</script>
</body>
</html>
